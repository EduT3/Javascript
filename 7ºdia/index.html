<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
  </head>
  <body>
    <section>
    <h1>Calculadora</h1>
    <p>Escolha dois números e uma operação.</p>
    <label for="valorA">Primeiro Valor</label>
    <input type="text" id="valorA" />
    <label for="operacao">Operação (+, -, *, /)</label>
    <input type="text" id="operacao" />
    <label for="valorB">Segundo Valor</label>
    <input type="text" id="valorB" />
    <button id="btn">Calcular!</button>

    <div id="resultado" role="status"></div>
</section>
    <a href="../index.html">Retornar</a>
    <script src="script.js"></script>
  </body>
</html>
